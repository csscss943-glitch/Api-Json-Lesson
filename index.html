  color: rgb(250 204 21 / var(--tw-text-opacity, 1));
}

.text-\[\#fb7185\]{
  --tw-text-opacity: 1;
  color: rgb(251 113 133 / var(--tw-text-opacity, 1));
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.line-through{
  text-decoration-line: line-through;
}

.decoration-\[\#fb7185\]{
  text-decoration-color: #fb7185;
}

.opacity-60{
  opacity: 0.6;
}

.opacity-90{
  opacity: 0.9;
}

.shadow-2xl{
  --tw-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
  --tw-shadow-colored: 0 25px 50px -12px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.blur-3xl{
  --tw-blur: blur(64px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur{
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#070b1e;
  --surface:#0d1330;
  --surface2:#141b42;
  --line:#2a3470;
  --text:#f8f7ff;
  --muted:#b8c0e8;
  --purple:#a855f7;
  --purple2:#c084fc;
  --blue:#38bdf8;
  --green:#4ade80;
  --yellow:#facc15;
  --orange:#fb923c;
  --pink:#f472b6;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#070b1e;
    --surface:#0d1330;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Cairo',system-ui,sans-serif;
  overflow-x:clip
}

.mono{
  font-family:'IBM Plex Mono',monospace;
  direction:ltr;
  text-align:left
}

.card{
  background:linear-gradient(180deg,var(--surface2),var(--surface));
  border:1px solid var(--line);
  border-radius:26px
}

.chip{
  border-radius:999px;
  padding:7px 14px;
  font-weight:800;
  font-size:15px
}

.btn{
  transition:.18s transform,.18s filter;
  cursor:pointer
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.12)
}

.btn:active{
  transform:scale(.98)
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes slideR{
  0%{
    transform:translateX(-30px);
    opacity:0
  }

  100%{
    transform:translateX(0);
    opacity:1
  }
}

@keyframes slideL{
  0%{
    transform:translateX(30px);
    opacity:0
  }

  100%{
    transform:translateX(0);
    opacity:1
  }
}

@keyframes pop{
  0%{
    transform:scale(.85);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(74,222,128,.45)
  }

  50%{
    box-shadow:0 0 0 12px rgba(74,222,128,0)
  }
}

.anim-r{
  animation:slideR .55s ease both
}

.anim-l{
  animation:slideL .55s ease both
}

.anim-pop{
  animation:pop .4s ease both
}

.floaty{
  animation:floaty 3s ease-in-out infinite
}

.glow-green{
  animation:pulseGlow 1.6s ease infinite
}

input,select,textarea{
  font-family:inherit
}

input:focus,select:focus,textarea:focus{
  outline:3px solid var(--purple);
  outline-offset:2px
}

.hover\:border-\[\#a855f7\]:hover{
  --tw-border-opacity: 1;
  border-color: rgb(168 85 247 / var(--tw-border-opacity, 1));
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}
